<!DOCTYPE html>
<html>
    <head>
        <title>測驗</title>
        <style>
            p{
                font-size: 30px;
            }
            button{
                font-size: 30px;
                margin-right: 20px;
                width: 100px;
            }
        </style>
    </head>
    <body>
        <p>請選擇 剪刀 石頭 布</p>
        <button onclick='
            playGame("剪刀");
        '>剪刀</button>
        <button  onclick='
            playGame("石頭");
        '>石頭</button>
        <button   onclick='
            playGame("布");
        '>布</button>

        <script>

            function generateComputerChoice() {
                const randomNum = Math.random()*3;
                let computerChoice = "";
                console.log(randomNum);
                if (0<=randomNum && randomNum<1) {
                    computerChoice = "剪刀";
                } else if (1<=randomNum && randomNum<2) {
                    computerChoice = "石頭";
                } else {
                    computerChoice = "布";
                }
                return computerChoice;
            }

            function playGame(userChoice) {
                // 創建一個函數 可以傳入玩家選擇、電腦選擇
                // 然後跳出提示框 顯示此局輸贏
                const computerChoice = generateComputerChoice();
                if (userChoice==="剪刀") {
                    if (computerChoice === "剪刀") {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局平手!`);
                    } else if (computerChoice === "石頭") {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局你輸了!`);
                    } else {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局你贏了!`);
                    }
                } else if (userChoice==="石頭") {
                    if (computerChoice === "剪刀") {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局你贏了!`);
                    } else if (computerChoice === "石頭") {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局平手!`);
                    } else {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局你輸了!`);
                    }
                } else {
                    if (computerChoice === "剪刀") {
                        alert(`你出${userChoice} 電腦出${computerChoice}，此局你輸了!`);
                    } else if (computerChoice === "石頭") {
                        alert(`你出布 電腦出${computerChoice}，此局你贏了!`);
                    } else {
                        alert(`你出布 電腦出${computerChoice}，此局平手!`);
                    }

                }
            }

        </script>
    </body>
</html>
