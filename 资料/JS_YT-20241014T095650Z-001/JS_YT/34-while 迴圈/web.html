<!DOCTYPE html>
<html>
    <head>
        <title>while loop 迴圈</title>
    </head>
    <body>
        
        <script>
            let i = 0;
            let sum = 0;
            let nums = [10, 20, 30, 40, 50, 60, 70];

            while (i<nums.length) {
                sum += nums[i];
                i = i+1;
            }

            console.log(sum/nums.length);
            
        </script>
    </body>
</html>
