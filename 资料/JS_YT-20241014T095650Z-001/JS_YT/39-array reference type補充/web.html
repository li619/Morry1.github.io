<!DOCTYPE html>
<html>
    <head>
        <title>array 補充</title>
    </head>
    <body>
        <script>
            // 陣列(数组) 跟物件依樣是引用類型(reference type)
            let a = [1, 2, 3];
            let b = a.slice();
            a.push(4);
            b.push(5);
            console.log(a);
            console.log(b);

        </script>
    </body>
</html>
