<!DOCTYPE html>
<html>
    <head>
        <title>物件(对象) object</title>
        <style>
            button{
                font-size:25px;
                margin-right:10px;
            }
            p{
                font-size: 25px;
                display: inline-block;
                margin-right:10px;
            }
            img{
                height: 200px;
                display: block;
                margin-top:50px;
            }
        </style>
    </head>
    <body>
        <button onclick="
            cart.showCart();
        ">購物車總額</button>
        <button onclick="
            cart.productNum = 0;
            cart.prodcut1.num = 0;
            cart.prodcut2.num = 0;
            cart.totalPrice = 0;
            console.log('已清空購物車');
            cart.showCart();
        ">清空購物車</button>

        <img src="product_images/product_image1.jpg">
        <p>$100</p>
        <button onclick="
            cart.productNum++;
            cart.prodcut1.num++;
            cart.totalPrice += 100;
            cart.showCart();
        ">加入購物車</button>

        <img src="product_images/product_image2.jpg">
        <p>$200</p>
        <button onclick="
            cart.productNum++;
            cart.prodcut2.num++;
            cart.totalPrice += 200;
            cart.showCart();
        ">加入購物車</button>
        

        <script>
            let cart = {
                productNum: 0,
                prodcut1: {
                    num: 0,
                    name: "海底撈泡麵",
                    price: 100
                },
                prodcut2: {
                    num: 0,
                    name: "養氣人蔘",
                    price: 200
                },
                totalPrice: 0,
                showCart: function showCart() {
                    console.log(`目前商品數 : ${cart.productNum}`);
                    console.log(`${cart.prodcut1.name} : ${cart.prodcut1.num}`);
                    console.log(`${cart.prodcut2.name} : ${cart.prodcut2.num}`);
                    console.log(`目前購物車總額 : ${cart.totalPrice}`);
                }
            };
            
            // 物件(对象) object 其他用法

            // cart.showCart();
            // console.log(typeof console.log);

            // console.log(cart['totalPrice']);
            // console.log(cart.prodcut2.price);

        </script>
    </body>
</html>
